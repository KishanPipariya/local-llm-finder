name: Bug report
description: Report a reproducible problem with the finder.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the finder. For security or privacy vulnerabilities, use GitHub's private **Report a vulnerability** form instead. Do not include private information or sensitive configuration URLs.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Finder UI
        - Recommendations or fit estimates
        - Catalogue retrieval
        - JSON API
        - Accessibility
        - Documentation or tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Open the finder
        2. Choose ...
        3. Submit the form
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, and selected runtime when relevant.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add screenshots or other non-sensitive details if useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I removed private information and sensitive configuration URLs.
          required: true
